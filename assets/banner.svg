<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Soft Drop Shadow for Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { opacity: 0.15; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .bg-grid {
      stroke: #334155;
      stroke-width: 1;
      stroke-opacity: 0.2;
    }
    .pulse-circle {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    .animated-line {
      stroke-dasharray: 8 8;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <g class="bg-grid">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200" />
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" />
  </g>

  <!-- Animated Glowing Background Elements -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" class="pulse-circle" />
  <circle cx="1050" cy="240" r="140" fill="#818cf8" class="pulse-circle" />

  <!-- Dynamic Network Connection Lines (Behind Text) -->
  <path d="M 50 270 L 250 210 L 450 250 L 650 190 L 850 230 L 1150 170" 
        fill="none" stroke="url(#accentGrad)" stroke-width="2" class="animated-line" opacity="0.4" />
  <path d="M 100 50 L 350 110 L 600 70 L 850 120 L 1100 60" 
        fill="none" stroke="#38bdf8" stroke-width="1.5" class="animated-line" opacity="0.3" />

  <!-- Foreground Title and Subtitle Container -->
  <g transform="translate(60, 60)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#accentGrad)" opacity="0.95" />
    <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="1">
      CLOUD IDENTITY &amp; ACCESS SECURITY
    </text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" filter="url(#shadow)">
      Awesome Cloud Infrastructure Entitlement Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
      Curated Ecosystem of CIEM Platforms, NHI Governance &amp; Open-Source Tools
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 148)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Least-Privilege IAM</text>

      <!-- Tag 2 -->
      <rect x="177" y="0" width="185" height="32" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="189" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8">Non-Human Identity</text>

      <!-- Tag 3 -->
      <rect x="374" y="0" width="165" height="32" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="386" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc">Multi-Cloud Audit</text>

      <!-- Tag 4 -->
      <rect x="551" y="0" width="175" height="32" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="563" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
