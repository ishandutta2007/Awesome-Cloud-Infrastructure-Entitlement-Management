<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    /* Dynamic Pulsing & Floating Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .bg-grid {
      stroke: #334155;
      stroke-width: 1;
      stroke-opacity: 0.25;
    }
    .pulse-circle {
      animation: pulseGlow 4s infinite ease-in-out;
      transform-origin: center;
    }
    .animated-line {
      stroke-dasharray: 8 8;
      animation: dashMove 15s linear infinite;
    }
    .floating-node {
      animation: floatCard 6s infinite ease-in-out;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Network -->
  <g class="bg-grid">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200" />
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" />
  </g>

  <!-- Background Animated Dynamic Elements (Placed behind content) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.15" class="pulse-circle" />
  <circle cx="1050" cy="240" r="140" fill="#818cf8" opacity="0.15" class="pulse-circle" />

  <!-- Dynamic Animated Graph Network Lines in Background -->
  <path d="M 100 260 L 250 200 L 400 240 L 550 180 L 700 220 L 850 160 L 1100 240" 
        fill="none" stroke="url(#accentGrad)" stroke-width="2" class="animated-line" opacity="0.5" />
  
  <path d="M 150 60 L 300 120 L 500 80 L 750 130 L 950 70 L 1120 120" 
        fill="none" stroke="#38bdf8" stroke-width="1.5" class="animated-line" opacity="0.3" />

  <!-- Foreground Title and Subtitle Container -->
  <g transform="translate(60, 65)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#accentGrad)" opacity="0.9" />
    <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="1">
      ⚡ CLOUD IDENTITY &amp; ACCESS SECURITY
    </text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" filter="url(#shadow)">
      Awesome Cloud Infrastructure Entitlement Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Curated Ecosystem of CIEM Platforms, NHI Governance &amp; Open-Source Tools
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 145)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🔒 Least-Privilege IAM</text>

      <!-- Tag 2 -->
      <rect x="172" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="184" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#818cf8">🤖 Non-Human Identity</text>

      <!-- Tag 3 -->
      <rect x="364" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="376" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#c084fc">⚡ Multi-Cloud Audit</text>

      <!-- Tag 4 -->
      <rect x="541" y="0" width="150" height="30" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="553" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">🌐 SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
